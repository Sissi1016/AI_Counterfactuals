[project]
name = "counterfactual-evaluators"
version = "0.1.0"
description = "Counterfactual evaluators: auditing how training signal and information set shape LLM predictions of patent examination"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "pyfixest>=0.28",
    "matplotlib>=3.9",
    "tabulate>=0.10.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.16",
    "joblib>=1.5",
    "threadpoolctl>=3.6",
    "fonttools>=4.59",
]

[tool.uv]
package = false

